name: Production CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ============================================================================
  # 1. CI STAGE: Code Validation, Testing & Pre-flight Docker Verification
  # ============================================================================
  ci:
    name: 🧪 CI - Lint, Test & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Automated Tests & Syntax Check
        run: npm test

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high || true

      - name: 🐳 Pre-flight Docker Build Verification
        run: |
          echo "Verifying Docker image builds cleanly in CI runner..."
          docker build -t preflight-check:latest .
          echo "✅ Docker build passed with 0 errors!"

  # ============================================================================
  # 2. CD STAGE: Automated Zero-Downtime Deployment to VM / EC2
  # ============================================================================
  deploy:
    name: 🚀 CD - Automated Deploy to VM
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=========================================================="
            echo "🚀 [AUTOMATION START] Deploying DevOps Engine v2.0"
            echo "=========================================================="

            APP_DIR=~/node.js_deployment-01

            # 1. Ensure directory exists and repo is synced cleanly
            if [ -d "$APP_DIR/.git" ]; then
              echo "📦 [1/6] Git repository found: Syncing to latest main..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            elif [ -d "$APP_DIR" ]; then
              echo "📦 [1/6] Existing directory found without .git: Syncing repository..."
              cd "$APP_DIR"
              git init -b main || git init
              git remote remove origin 2>/dev/null || true
              git remote add origin "https://github.com/${{ github.repository }}.git"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📥 [1/6] First-time setup: Cloning repository..."
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # 2. Update Nginx static files if Nginx is installed
            if command -v nginx > /dev/null 2>&1; then
              echo "🎨 [2/6] Updating Nginx frontend assets in /var/www/myapp..."
              sudo mkdir -p /var/www/myapp
              sudo cp index.html style.css script.js /var/www/myapp/
              echo "🌐 Verifying Nginx configuration..."
              sudo nginx -t
              sudo systemctl reload nginx || true
            else
              echo "ℹ️  [2/6] Nginx not detected on host, skipping Nginx static sync."
            fi

            # 3. Build optimized Docker image with BuildKit caching
            echo "🐳 [3/6] Building optimized Docker image..."
            DOCKER_BUILDKIT=1 docker build -t my-node-app:latest .

            # 4. Safe Pre-flight verification on a temporary test container
            echo "🧪 [4/6] Verifying new build health on test port..."
            docker run -d --name temp-health-check -p 3001:5000 my-node-app:latest
            
            # Wait for test container to boot and verify /api/health
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "✅ Pre-flight container health check PASSED!"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "❌ Pre-flight check failed! Aborting deployment to protect running service."
                docker logs temp-health-check
                docker stop temp-health-check && docker rm temp-health-check
                exit 1
              fi
              sleep 2
            done
            docker stop temp-health-check && docker rm temp-health-check

            # 5. Swap to live container seamlessly
            echo "🔄 [5/6] Swapping live container to port 3000..."
            docker stop my-node-app || true
            docker rm my-node-app || true

            docker run -d \
              --name my-node-app \
              --restart unless-stopped \
              -p 3000:5000 \
              my-node-app:latest

            # 6. Verify Live Telemetry
            echo "🩺 [6/6] Verifying live production endpoint..."
            HEALTH_RESPONSE=$(curl -fsS http://localhost:3000/api/health)
            echo "Status Response: $HEALTH_RESPONSE"

            # Optional check through Nginx if Nginx is active
            if command -v nginx > /dev/null 2>&1; then
              echo "🌐 Testing reverse-proxy via Nginx (/api/health)..."
              curl -fsS http://localhost/api/health > /dev/null 2>&1 || true
            fi

            # Clean up dangling images to save VM disk space
            echo "🧹 Cleaning up dangling images..."
            docker image prune -f || true

            echo "=========================================================="
            echo "🎉 [AUTOMATION COMPLETE] Service is LIVE and HEALTHY! 🚀"

            echo "=========================================================="
