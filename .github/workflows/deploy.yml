
name: Node.js CI-CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: CI - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Test backend
        run: npm test

      - name: Debug frontend JavaScript
  run: |
    echo "Commit being tested:"
    git rev-parse HEAD

    echo "Actual script.js lines:"
    sed -n '10,18l' script.js

    echo "Checking JavaScript syntax:"
    node --check script.js

  deploy:
    name: CD - Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend and backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting deployment..."

            cd ~/node.js_deployment-01

            echo "Pulling latest code..."
            git pull origin main

            echo "Updating frontend files..."
            sudo mkdir -p /var/www/myapp
            sudo cp index.html style.css script.js /var/www/myapp/

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Building Docker image..."
            docker build -t my-node-app .

            echo "Replacing old container..."
            docker stop my-node-app || true
            docker rm my-node-app || true

            echo "Starting new container..."
            docker run -d \
              --name my-node-app \
              --restart unless-stopped \
              -p 3000:5000 \
              my-node-app

            echo "Checking backend health..."
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:3000/api; then
                echo "Backend is healthy."
                break
              fi

              if [ "$i" -eq 10 ]; then
                echo "Backend health check failed."
                docker logs my-node-app
                exit 1
              fi

              sleep 3
            done

            echo "Checking Nginx API proxy..."
            curl -fsS http://localhost/api

            echo "Deployment completed successfully."
