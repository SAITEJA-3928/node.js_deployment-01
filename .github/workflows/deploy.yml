name: Production CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================================
  # CI STAGE: Code Validation, Testing & Docker Build Verification
  # ============================================================================
  ci:
    name: 🧪 CI - Lint, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Automated Tests & Syntax Validation
        run: npm test

      - name: 🛡️ Security Audit (Dependencies)
        run: npm audit --audit-level=high || true

      - name: 🐳 Pre-flight Docker Build Verification
        run: |
          echo "Verifying Dockerfile builds cleanly before deployment..."
          docker build -t test-build-image .
          echo "✅ Docker build test passed successfully!"

  # ============================================================================
  # CD STAGE: Zero-Downtime Deployment to AWS EC2
  # ============================================================================
  deploy:
    name: 🚀 CD - Zero-Downtime Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=========================================================="
            echo "🚀 [START] Automated Deployment: Node.js DevOps v2.0"
            echo "=========================================================="

            APP_DIR=~/node.js_deployment-01
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "📦 [1/6] Pulling latest changes from main branch..."
            git pull origin main

            echo "🎨 [2/6] Updating Nginx static frontend web assets..."
            sudo mkdir -p /var/www/myapp
            sudo cp index.html style.css script.js /var/www/myapp/

            echo "🌐 [3/6] Verifying Nginx configuration syntax..."
            sudo nginx -t

            echo "🐳 [4/6] Building optimized Alpine Docker image..."
            DOCKER_BUILDKIT=1 docker build -t my-node-app:latest .

            echo "🔄 [5/6] Performing Safe Zero-Downtime Container Swap..."
            # Stop existing container cleanly if present
            docker stop my-node-app || true
            docker rm my-node-app || true

            # Launch new production container with auto-restart
            docker run -d \
              --name my-node-app \
              --restart unless-stopped \
              -p 3000:5000 \
              my-node-app:latest

            echo "🩺 [6/6] Verifying Backend Health Telemetry..."
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3000/api/health > /dev/null; then
                echo "✅ Backend container is HEALTHY and accepting traffic!"
                break
              fi

              if [ "$i" -eq 12 ]; then
                echo "❌ Backend health check timed out. Fetching Docker container logs:"
                docker logs --tail 50 my-node-app
                exit 1
              fi

              echo "Waiting for container startup (attempt $i/12)..."
              sleep 2
            done

            echo "🌐 Testing Nginx Reverse Proxy routing (/api/health)..."
            curl -fsS http://localhost/api/health

            echo "🧹 Pruning dangling docker cache..."
            docker image prune -f || true

            echo "=========================================================="
            echo "🎉 [SUCCESS] Deployment v2.0 completed successfully!"
            echo "=========================================================="
